[package]
name = "wave-desktop"
version = "0.1.0"
edition = "2024"

# 画面に依らない部分。GTK・libadwaita・WebKit・Qt には依らない（glib・gio・GStreamer は使う）。
[dependencies]
libc = "0.2"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
getrandom = "0.3"
gio = "0.22"
glib = "0.22"
gst = { version = "0.25.4", package = "gstreamer" }
gst_app = { version = "0.25.2", package = "gstreamer-app" }
hex = "0.4"
oo7 = { version = "0.6.0", default-features = false, features = ["tokio", "native_crypto"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
regex = "1.13.1"
rusqlite = "0.37"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
wave-core = { version = "0.1.0", path = "../wave-core" }
