[package]
name = "wave-core"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["sink", "alloc"] }
getrandom = "0.3"
hex = "0.4.3"
hmac = "0.12"
indexmap = { version = "2", features = ["serde"] }
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8"] }
percent-encoding = "2.3.2"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "brotli"] }
rquickjs = { version = "0.14.0", features = ["parallel"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.10"
subtle = "2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt", "macros", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
