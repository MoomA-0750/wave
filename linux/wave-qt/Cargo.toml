[package]
name = "wave-qt"
version = "0.1.0"
edition = "2024"

# QML（Qt Quick ＋ Material）の画面。中身は wave-desktop を使い、Rust の中身は cxx-qt で QML に渡す。
# GTK には依らない（GTK と Qt を1つの実行ファイルにリンクしない）。
[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
gio = "0.22"
glib = "0.22"
gst = { version = "0.25.4", package = "gstreamer" }
gst_app = { version = "0.25.2", package = "gstreamer-app" }
gst_video = { version = "0.25", package = "gstreamer-video" }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
wave-core = { version = "0.1.0", path = "../wave-core" }
wave-desktop = { version = "0.1.0", path = "../wave-desktop" }

[build-dependencies]
cxx-qt-build = "0.10"
