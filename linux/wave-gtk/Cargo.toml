[package]
name = "wave-gtk"
version = "0.1.0"
edition = "2024"

# GTK4・libadwaita の画面。画面に依らない部分は wave-desktop にある。
[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
gst = { version = "0.25.4", package = "gstreamer" }
gst_app = { version = "0.25.2", package = "gstreamer-app" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
soup = { version = "0.9.0", package = "soup3" }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
wave-core = { version = "0.1.0", path = "../wave-core" }
wave-desktop = { version = "0.1.0", path = "../wave-desktop" }
webkit6 = "0.6.1"

[dev-dependencies]
rqrr = "0.10"
