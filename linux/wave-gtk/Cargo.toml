[package]
name = "wave-gtk"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
getrandom = "0.3"
gst = { version = "0.25.4", package = "gstreamer" }
gst_app = { version = "0.25.2", package = "gstreamer-app" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
hex = "0.4"
oo7 = { version = "0.6.0", default-features = false, features = ["tokio", "native_crypto"] }
qrcode = { version = "0.14", default-features = false }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
soup = { version = "0.9.0", package = "soup3" }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
wave-core = { version = "0.1.0", path = "../wave-core" }
webkit6 = "0.6.1"

[dev-dependencies]
rqrr = "0.10"
